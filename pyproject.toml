[project]
name = "basketball-motion-lab"
version = "0.1.0"
description = "Local-first NBA shot and movement data inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "py7zr>=1,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
basketball = "bkbdata.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/bkbdata/src/bkbdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
